# Nginx site for the Nook backend. Replace YOUR_DOMAIN, then copy to
# /etc/nginx/sites-available/nook. Certbot adds the HTTPS parts afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3001;

        # These three lines are what let a WebSocket through. Without them Socket.IO cannot connect.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must stay above Socket.IO's ping interval plus timeout (45 s), or idle sockets get cut.
        proxy_read_timeout 90s;
    }
}
